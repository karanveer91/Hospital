<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors</title>
    <link rel="stylesheet" href="contact.css">

<body>
    <style>
        /* Doctors Section Start */
.doctors .boxContainer {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(30rem, 1fr));
  gap: 2rem;
}
.doctors .boxContainer .box {
  border-radius: 0.5rem;
  text-align: center;
  border: 0.5rem solid var(--main);
  box-shadow: 0.5rem 1rem 1.5rem rgba(0, 0, 0, 0.9);
  padding: 2rem;
}
.doctors .boxContainer .box:hover {
  transform: scale(1.03);
}
.doctors img {
  border: 0.2rem solid var(--main);
  border-radius: 0.5rem;
  height: 20rem;
  width: 100%;
  margin-top: 1rem;
  object-fit: cover;
  margin-bottom: 1rem;
}

.doctors .boxContainer .box h6 {
  font-size: 2.5rem;
}
.doctors .box span {
  color: var(--main);
  font-size: 1.5rem;
}
.doctors .boxContainer .box .icons {
  padding-top: 2rem;
}
.doctors .boxContainer .box .icons i {
  font-size: 2rem;
  line-height: 4.5rem;
  height: 5rem;
  width: 5rem;
  color: var(--main);
  border: 0.2rem solid var(--main);
  border-radius: 0.5rem;
  margin: 0.3rem;
  cursor: pointer;
}
.doctors .boxContainer .box .icons i:hover {
  background: var(--main);
  color: #fff;
}
/* Global Variables */
:root {
  --main: #ff041d;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Besley", serif;
  outline: none;
  border: none;
  transition: 0.2s all linear;
  text-decoration: none;
  text-transform: capitalize;
}
*::selection {
  background: var(--main);
  color: #000;
}
html {
  font-size: 62.5%;
  overflow-x: hidden;
  scroll-behavior: smooth;
  scroll-padding-top: 7rem;
}
section {
  padding: 2rem 9%;
}
html::-webkit-scrollbar {
  width: 10px;
}
html::-webkit-scrollbar-thumb {
  background: var(--main);
}
html::-webkit-scrollbar-track {
  background: #000;
}
.btn {
  display: inline-block;
  box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.7);
  margin-top: 1rem;
  padding: 0.5rem;
  padding-left: 1rem;
  font-size: 1.7rem;
  color: var(--main);
  border-radius: 0.5rem;
}
.btn span {
  background: var(--main);
  color: #fff;
  margin-left: 0.5rem;
  padding: 0.7rem 1rem;
  border-radius: 0.5rem;
}
.btn:hover {
  background: var(--main);
  color: #fff;
}
.btn:hover span {
  color: var(--main);
  background: #fff;
  margin-left: 1.2rem;
}
.heading {
  text-align: center;
  padding-bottom: 2rem;
  font-size: 5rem;
  letter-spacing: 0.3rem;
  text-transform: uppercase;
}
.heading span {
  color: var(--main);
  text-transform: uppercase;
}
/* Header/Navbar Start */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: 2rem 9%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.7);
  background: #fff;
}
.header .logo {
  font-size: 2.5rem;
  color: #000;
}
.header .logo i {
  color: var(--main);
}
.header .navbar a {
  color: #333;
  margin-left: 2rem;
  font-size: 1.7rem;
}
.header .navbar a:hover {
  color: var(--main);
}
#MenuBtn {
  background: #eee;
  font-size: 2.5rem;
  cursor: pointer;
  color: var(--main);
  padding: 1rem 1.5rem;
  border-radius: 0.6rem;
  display: none;
}
/* Header/Navbar End */

/* Doctors Section End */
</style>
<!-- Doctors Section Start -->
